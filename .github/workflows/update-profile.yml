name: Refresh profile artwork
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real contribution activity
        run: python scripts/fetch_contributions.py
      - name: Render SVGs
        run: python scripts/build_profile.py
      - name: Commit refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile artwork [skip ci]'
          git push
