<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="426" viewBox="0 0 1000 426" role="img" aria-labelledby="title desc">
<title id="title">Jishan Mulla — DevOps Engineer</title><desc id="desc">Animated DevOps profile artwork for Jishan Mulla. Decorative animations, not live infrastructure status.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#172536" stroke-width="0.6"/></pattern><linearGradient id="fade"><stop stop-color="#123743"/><stop offset="1" stop-color="#0c1420"/></linearGradient></defs>
<style>text{font-family:Consolas,'Liberation Mono',monospace}.reveal{animation:appear .7s both;animation-delay:var(--d,0s)}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.trace{stroke-dasharray:1400;animation:draw 2s ease-out both}@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="998" height="424" rx="18" fill="#0c1420" stroke="#243549"/><rect x="2" y="2" width="996" height="422" rx="18" fill="url(#grid)"/>
<path d="M1 48H999" stroke="#243549"/><circle cx="26" cy="25" r="5" fill="#ff6b78"/><circle cx="46" cy="25" r="5" fill="#e8bb66"/><circle cx="66" cy="25" r="5" fill="#57d6ad"/><text x="112" y="30" font-size="12" fill="#9cacbf" >jishan@github:~ / infrastructure-terminal</text><text x="824" y="30" font-size="11" fill="#56dac8" >PROFILE / 01</text><rect x="36" y="83" width="212" height="222" rx="16" fill="url(#fade)" stroke="#2c5966"/><path class="trace" d="M61 122V108H83 M202 108H223V130 M61 267V281H83 M201 281H223V260" fill="none" stroke="#59e1cf" stroke-width="2"/><text x="70" y="222" font-size="94" fill="#e3f9f5" font-weight="bold" class="reveal">JM</text><text x="86" y="258" font-size="20" fill="#57d6ad" >&gt;_</text><g class="reveal" style="--d:.25s"><text x="285" y="101" font-size="11" fill="#57d6ad" >ENGINEERING / OPERATIONS / AUTOMATION</text><text x="281" y="158" font-size="47" fill="#eef5ff" font-weight="bold">JISHAN MULLA</text><text x="285" y="195" font-size="21" fill="#6ed7ee" >DevOps Engineer</text></g><g class="reveal" style="--d:.6s"><text x="285" y="236" font-size="16" fill="#c3cfdd" >From source code to dependable infrastructure.</text><text x="285" y="265" font-size="14" fill="#9cacbf" >Cloud + on-prem Kubernetes. Repeatable delivery.</text><text x="285" y="289" font-size="14" fill="#9cacbf" >Observe. Diagnose. Automate. Improve.</text></g><path d="M36 332H964" stroke="#243549"/><text x="36" y="366" font-size="12" fill="#57d6ad" >01 / BUILD</text><text x="357" y="366" font-size="12" fill="#6ed7ee" >02 / OPERATE</text><text x="692" y="366" font-size="12" fill="#c1a5ff" >03 / IMPROVE</text><text x="36" y="393" font-size="13" fill="#9cacbf" >Pipelines &amp; infrastructure</text><text x="357" y="393" font-size="13" fill="#9cacbf" >Clusters &amp; observability</text><text x="692" y="393" font-size="13" fill="#9cacbf" >Automation &amp; recovery</text></svg>