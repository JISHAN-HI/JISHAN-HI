7d6ad" >05</text><text x="811" y="161" font-size="17" fill="#edf5ff" >OBSERVE</text><text x="811" y="191" font-size="11" fill="#9cacbf" >Metrics / Logs</text></g><text x="32" y="253" font-size="12" fill="#6ed7ee" >AUTOMATE THE REPETITION. KEEP THE ENGINEERING.</text></svg>